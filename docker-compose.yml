services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reconagent
      POSTGRES_PASSWORD: reconagent
      POSTGRES_DB: reconagent
    ports:
      - "5432:5432"
    volumes:
      - reconagent_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://reconagent:reconagent@postgres:5432/reconagent
      REDIS_URL: redis://redis:6379/0
      USE_RQ: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: rq worker reconagent --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://reconagent:reconagent@postgres:5432/reconagent
      REDIS_URL: redis://redis:6379/0
      USE_RQ: "true"
    depends_on:
      - postgres
      - redis

volumes:
  reconagent_postgres:
