[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconagent"
version = "0.1.0"
description = "AI finance operations agent for invoice, payment, and ledger reconciliation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.111",
  "openai>=1.40",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "rq>=1.16",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reconagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
